name: PR branch verification

on:
  push:
    branches:
      - fix/boot-animation-defects

permissions:
  contents: write

jobs:
  build-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm run check
      - name: Commit rebuilt client bundle
        run: |
          if git diff --quiet -- lib/client.js lib/client.js.map; then
            echo "client bundle already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/client.js lib/client.js.map
          git commit -m "chore: rebuild client bundle"
          git push
