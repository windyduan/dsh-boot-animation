name: PR branch verification

on:
  push:
    branches:
      - fix/boot-animation-defects

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: rebuilt-lib
          path: lib/
